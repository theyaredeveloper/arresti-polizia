<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brookhaven RP | Portale Verbali</title><style>:root{font-family:Inter,system-ui,Arial,sans-serif;color:#eaf0ff;background:#090f1d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#183358 0,#090f1d 55%);min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:32px 18px}header{display:flex;align-items:center;gap:15px;margin-bottom:28px}.logo{font-size:32px;background:#1d3456;padding:15px;border-radius:18px}h1{font-size:26px;margin:0}header p{color:#a9b8d3;margin:6px 0}.panel{background:#121e32;border:1px solid #293c57;border-radius:20px;padding:24px;box-shadow:0 14px 40px #0004}.tabs{display:flex;gap:10px;margin-bottom:23px}.tab{border:1px solid #345071;border-radius:12px;background:#192b45;color:#cbd9f2;padding:13px 20px;font-weight:700;cursor:pointer}.tab.active{background:#3874f6;color:white;border-color:#3874f6}.layout{display:grid;grid-template-columns:1fr 1fr;gap:22px}h2{font-size:18px;margin:0 0 17px}.fields{display:grid;gap:13px}label{display:block;color:#c3d1e8;font-size:13px;font-weight:650;margin-bottom:6px}input,select,textarea{width:100%;padding:12px;border-radius:10px;background:#0a1528;border:1px solid #345071;color:#f5f8ff;font:inherit;outline:none}input:focus,select:focus{border-color:#6da4ff}textarea{resize:vertical;min-height:380px;white-space:pre-wrap;line-height:1.6}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}button{font:inherit;cursor:pointer}.primary{background:#3874f6;color:white;border:0;padding:13px 17px;border-radius:11px;font-weight:750}.secondary{background:#21344f;color:white;border:1px solid #3b5271;padding:12px 16px;border-radius:11px}.note{color:#9eb0cc;font-size:13px;line-height:1.5;margin-top:12px}.success{color:#76e0a9;font-size:14px;min-height:22px;margin-top:10px}@media(max-width:750px){.layout{grid-template-columns:1fr}.wrap{padding:18px 12px}.panel{padding:17px}.tab{flex:1;padding:12px 6px;font-size:13px}h1{font-size:21px}}</style></head><body><main class="wrap"><header><div class="logo">🚔</div><div><h1>Brookhaven RP · Portale Verbali</h1><p>Generatore ufficiale di template Discord per multe e arresti</p></div></header><section class="panel"><div class="tabs"><button class="tab active" id="fineTab" type="button">📋 Archivio Multe</button><button class="tab" id="arrestTab" type="button">⛓️‍💥 Archivio Arresti</button></div><div class="layout"><div><h2 id="formTitle">Compila una multa</h2><form id="form" class="fields"></form><div class="actions"><button class="primary" id="generate" type="button">✨ Genera Template</button><button class="secondary" id="reset" type="button">↺ Svuota campi</button></div></div><div><h2>📄 Template Discord</h2><textarea id="output" readonly placeholder="Compila i campi e clicca Genera Template..."></textarea><div class="actions"><button class="primary" id="copy" type="button">📋 Copia per Discord</button></div><div class="success" id="feedback" aria-live="polite"></div><p class="note">Il testo conserva il formato originale, incluse le parentesi quadre. Su Discord verrà visualizzato con la formattazione Markdown.</p></div></div></section></main><script>const common=[['subject','Soggetto','Nome Cittadino'],['roblox','Username Roblox','Username Roblox']];const tail=[['agent','Agente','Nome e Cognome Agente'],['rank','Rank','Grado Agente'],['proof','Prova','Link Foto/Video']];const configurations={fine:{title:'Compila una multa',fields:[...common,['reason','Motivo','Articolo o Breve descrizione'],['amount','Importo','€'],...tail,['status','Stato','', ['In attesa','Pagata']]]},arrest:{title:'Compila un arresto',fields:[...common,['reason','Motivo/Reato','Articolo o Breve descrizione'],['jail','Tempo di Carcere','Minuti / Mesi di pena'],['bail','Cauzione','Importo $ / Non Disponibile'],...tail,['status','Stato','',['In cella','Rilasciato']]]}};let mode='fine';const form=document.getElementById('form'),out=document.getElementById('output'),feedback=document.getElementById('feedback');function render(){form.innerHTML='';document.getElementById('formTitle').textContent=configurations[mode].title;for(const [id,label,placeholder,choices] of configurations[mode].fields){const div=document.createElement('div'),lab=document.createElement('label');lab.htmlFor=id;lab.textContent=label;div.append(lab);let el;if(choices){el=document.createElement('select');for(const choice of choices){const opt=document.createElement('option');opt.value=choice;opt.textContent=choice;el.append(opt)}}else{el=document.createElement('input');el.type='text';el.placeholder=placeholder}el.id=id;el.autocomplete='off';div.append(el);form.append(div)}out.value='';feedback.textContent='';document.getElementById('fineTab').classList.toggle('active',mode==='fine');document.getElementById('arrestTab').classList.toggle('active',mode==='arrest')}function val(id){return document.getElementById(id).value.trim()||'—'}function generate(){const subject=val('subject'),roblox=val('roblox'),reason=val('reason'),agent=val('agent'),rank=val('rank'),proof=val('proof'),status=val('status');if(mode==='fine'){out.value=`---**📋 ARCHIVIO MULTE**---\n\nSoggetto: [${subject}]\nUsername Roblox: [${roblox}]\n\n-----------------------------\n\nMotivo: [${reason}]\nImporto: [${val('amount')}]\n\n-----------------------------\n\nAgente: [${agent}]\nRank: [${rank}]\n\n-----------------------------\n\nProva: [${proof}]\nStato: [${status}]\n\n-----------------------------`;}else{out.value=`---**⛓️‍💥 ARCHIVIO ARRESTI**---\n\nSoggetto: [${subject}]\nUsername Roblox: [${roblox}]\n\n-----------------------------\n\nMotivo/Reato: [${reason}]\nTempo di Carcere: [${val('jail')}]\nCauzione: [${val('bail')}]\n\n-----------------------------\n\nAgente: [${agent}]\nRank: [${rank}]\n\n-----------------------------\n\nProva: [${proof}]\nStato: [${status}]\n\n-----------------------------`;}feedback.textContent='✅ Template generato! Ora puoi copiarlo.'}document.getElementById('fineTab').onclick=()=>{mode='fine';render()};document.getElementById('arrestTab').onclick=()=>{mode='arrest';render()};document.getElementById('generate').onclick=generate;document.getElementById('reset').onclick=()=>{render()};document.getElementById('copy').onclick=async()=>{if(!out.value)generate();try{await navigator.clipboard.writeText(out.value);feedback.textContent='✅ Copiato! Incollalo su Discord.'}catch(e){out.focus();out.select();try{document.execCommand('copy');feedback.textContent='✅ Copiato! Incollalo su Discord.'}catch(e2){feedback.textContent='Seleziona il testo e copialo manualmente.'}}};render();</script></body></html>
